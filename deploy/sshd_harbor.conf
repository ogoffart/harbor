# Drop-in for /etc/ssh/sshd_config.d/harbor.conf
#
# Serve Harbor to anyone connecting as the `harbor` user: force the sandboxed
# launcher regardless of what command the client requests, and lock the account
# down to that single purpose.
#
# After installing: `sudo sshd -t && sudo systemctl reload ssh`
# Connect with:      `ssh harbor@your-host`   (no command -> a PTY is allocated)

Match User harbor
    ForceCommand /usr/local/bin/harbor-login
    PermitTTY yes
    PasswordAuthentication no
    PubkeyAuthentication yes
    X11Forwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    # One interactive image stream per connection is plenty:
    MaxSessions 1
